name: Build Magic Pro Camera AI V3
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
 debug-apk:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - name: Download Gradle
     run: curl -sSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /tmp
   - name: Build debug APK
     run: /tmp/gradle-8.10.2/bin/gradle assembleDebug --stacktrace
   - uses: actions/upload-artifact@v4
     with: { name: magic-pro-camera-ai-v3-debug, path: app/build/outputs/apk/debug/app-debug.apk }
